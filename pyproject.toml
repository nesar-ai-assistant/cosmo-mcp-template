[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cosmo-template-mcp-server"
version = "0.1.0"
description = "TEMPLATE"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "mcp[cli]>=1.27,<2",
    "pydantic>=2,<3",
    "numpy",
    "scipy",
    "matplotlib>=3.8",
]

[project.optional-dependencies]
dev = ["pytest", "anyio", "ruff"]
# hpc = ["hep-genesis[iri]"]  # server-side dispatch: pip install -e <hep-genesis-agent>/backend[iri]

[tool.mcp-server]
name = "Template MCP Server"
skill_prefix = "template"
port = 8000
instructions_file = "mcp_server/INSTRUCTIONS.md"
tool_modules = [
    "tools.meta",
    "tools.example",
    "mcp_server.dispatch",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["mcp_server*", "tools*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
markers = ["network: needs internet (deselect with -m 'not network')"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "B"]
ignore = ["E501", "B008"]
